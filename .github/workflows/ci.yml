# CI -- run on every push to main and every PR targeting main. Four
# independent jobs so a failure in one doesn't mask the others:
#
#   host-build : `make host` with the strict -Wall -Wextra -Werror flags,
#                then tests/run_golden.sh -- golden-file regression tests
#                for wyomingtest/saytest against tests/mock_wyoming_server.py
#                (a canned, deterministic stand-in for Piper), byte-comparing
#                output against tests/golden/*. Catches regressions in the
#                Wyoming framing (wyoming.c) and WAV writing (audio_host.c)
#                without needing a real Piper server or an Amiga emulator.
#
#   amiga-dist : `make dist` -- runs the Bebbo m68k-amigaos-gcc cross
#                compiler inside the digest-pinned Docker image and packs
#                the Aminet archive. Uploads the resulting lha as a
#                workflow artifact so reviewers can grab and inspect a
#                build for any commit without rebuilding locally.
#
#   copperline-smoke : the first actual on-target CI coverage this repo has
#                had. Runs in ghcr.io/sidick/amiga-dev:1 (the same Bebbo
#                toolchain as amiga-dist, plus the runtime libs -- lavapipe
#                Vulkan, ALSA -- Copperline needs); the Copperline binary
#                itself is downloaded fresh each run as the upstream
#                AppImage, pinned by version (COPPERLINE_VERSION), extracted
#                with --appimage-extract (no FUSE needed) rather than using
#                whatever Copperline happens to be baked into the container
#                image. This job cross-compiles wyomingtest and runs it
#                under Copperline (bundled AROS ROM, no licensed Kickstart
#                needed). Reaches the same mock Wyoming server host-build
#                uses over Copperline's [hostsocket] board (net = "host"),
#                and byte-compares the PCM it writes against
#                tests/golden/wyomingtest.pcm -- the same fixture host-build
#                already checked, now also proving the real cross-compiled
#                Amiga binary + bsdsocket.library path works end to end.
#                Deliberately does not cover AHI/narrator.device/Say (no
#                licensed Workbench install available in CI); see
#                tests/run_smoke.sh and tests/copperline/machine.toml.
#
#   semgrep    : security/quality scan with semgrep's auto rule pack.
#                Same configuration we run locally with `semgrep --config
#                auto`. Fails on any blocking finding.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new push comes in -- saves CI
# time when someone is force-pushing iterations during review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-build:
    name: Host build (cc, strict warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make host
        run: make host
      - name: smoke-run host binaries
        # Both binaries print usage on a bad arg; we just want a non-segfault
        # exit, not a specific status -- so accept either with `|| true`.
        run: |
          ./build/host/wyomingtest 2>&1 | head -5 || true
          ./build/host/saytest     2>&1 | head -5 || true
      - name: golden-file regression tests
        run: tests/run_golden.sh

  amiga-dist:
    name: Amiga cross-build + Aminet archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Derive the image ref from the Makefile so the cache key tracks the
      # pinned digest automatically -- when `make refresh-codesets`-style
      # maintenance bumps IMAGE in the Makefile, the cache key changes,
      # the old tarball is dropped, and the next run pulls + caches the
      # new image. No manual cache invalidation needed.
      - name: Resolve pinned amiga-gcc image ref
        id: img
        run: |
          REF=$(grep '^IMAGE ' Makefile \
                  | sed -E 's/^[^=]+= *//; s/[[:space:]]+$//')
          KEY=$(echo "$REF" | tr ':/@' '___')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Using image ref: $REF"

      # Cache the docker save tarball. ~500 MB; cache hits skip the pull
      # entirely (saves ~30-60 s per workflow). Miss -> pull + save.
      - name: Cache amiga-gcc Docker image
        id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/amiga-gcc.tar
          key: amiga-gcc-${{ steps.img.outputs.key }}

      - name: Load cached image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load < /tmp/amiga-gcc.tar

      - name: Pull + save image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull "${{ steps.img.outputs.ref }}"
          docker save "${{ steps.img.outputs.ref }}" > /tmp/amiga-gcc.tar

      - name: make dist (pinned amiga-gcc image)
        run: make dist

      - name: Inspect archive
        run: |
          ls -la build/
          # Use the pinned image (it has lha) to list the archive contents;
          # avoids requiring lha on the runner itself.
          docker run --rm -v "$(pwd)":/work -w /work \
            "${{ steps.img.outputs.ref }}" \
            lha l build/NarratorWyomingDevice.lha

      # Aminet readme + archive structure validation. Run the Aminet release
      # action in validate-only mode (no FTP upload, no release-asset
      # attachment) -- catches readme format drift (mismatched Type:,
      # missing fields, malformed headers) on every PR, rather than at
      # manual upload time when the regression is already in main.
      - name: Validate Aminet package (readme + structure)
        uses: sidick/aminet-release-action@v1
        with:
          filename: build/NarratorWyomingDevice.lha
          readme: NarratorWyomingDevice.readme
          category: util/sys
          validate-only: true

      - name: Upload archive as artifact
        uses: actions/upload-artifact@v7
        with:
          name: NarratorWyomingDevice-${{ github.sha }}
          path: |
            build/NarratorWyomingDevice.lha
            NarratorWyomingDevice.readme
          retention-days: 14

  copperline-smoke:
    name: On-target smoke test (Copperline)
    runs-on: ubuntu-latest
    # sidick/amiga-dev supplies the toolchain (Bebbo m68k-amigaos-gcc
    # 6.5.0b, amiga6 branch) plus the runtime shared libs Copperline needs
    # (lavapipe Vulkan, ALSA, ...). The Copperline *binary* itself no
    # longer comes from this image -- it's downloaded fresh below, pinned
    # to an upstream release tag, so the emulator version this job runs is
    # controlled independently of whenever the container image was last
    # rebuilt (see the Aug 2026 incident below the digest pin).
    #
    # Pinned by digest (same policy as amiga-dist's compiler image): the
    # mutable :1 tag silently swapped NDKs under us once (its new
    # inline/bsdsocket.h broke the SocketBaseTags vararg macro) -- resolve
    # the digest of :1 and update here deliberately when upgrading.
    container: ghcr.io/sidick/amiga-dev@sha256:a49b86f7386314afd7a81a792579c05a98f7d2076e06f113db15aab8bf0fdec7
    env:
      # Pin to an upstream Copperline release tag (verified locally against
      # this project's tests/run_nondist.sh before bumping -- see CLAUDE.md).
      COPPERLINE_VERSION: "0.18.0"
    steps:
      - uses: actions/checkout@v7

      # Cache the downloaded AppImage by version -- immutable once a
      # release is published, so a cache hit skips the ~45 MB download
      # entirely.
      - name: Cache Copperline AppImage
        id: copperline-cache
        uses: actions/cache@v6
        with:
          path: /tmp/copperline.AppImage
          key: copperline-appimage-${{ env.COPPERLINE_VERSION }}

      - name: Download Copperline AppImage
        if: steps.copperline-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/CopperlineHQ/Copperline/releases/download/v${COPPERLINE_VERSION}/Copperline-${COPPERLINE_VERSION}-x86_64.AppImage"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL -o /tmp/copperline.AppImage "$url"
          else
            wget -q -O /tmp/copperline.AppImage "$url"
          fi

      # Extract rather than run the AppImage directly: --appimage-extract
      # unsquashes it without needing FUSE/libfuse2, which this container
      # doesn't have installed. squashfs-root/AppRun is the real binary;
      # symlink it into a PATH directory as `copperline` so
      # tests/run_smoke.sh's `command -v copperline` check keeps working
      # unmodified.
      - name: Extract Copperline AppImage
        run: |
          chmod +x /tmp/copperline.AppImage
          cd /tmp && /tmp/copperline.AppImage --appimage-extract
          mkdir -p "$HOME/.local/bin"
          ln -sf /tmp/squashfs-root/AppRun "$HOME/.local/bin/copperline"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify downloaded Copperline version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          got=$(copperline --version | tee /dev/stderr)
          case "$got" in
            *"$COPPERLINE_VERSION"*) ;;
            *) echo "expected Copperline $COPPERLINE_VERSION, got: $got" >&2; exit 1 ;;
          esac

      - name: Cross-compile wyomingtest
        run: make build/amiga/wyomingtest

      - name: On-target smoke test
        run: tests/run_smoke.sh

  semgrep:
    name: Semgrep (auto rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Cache the pip wheel for semgrep so subsequent runs skip the ~10 MB
      # download. Keyed on this workflow file's hash so any change to how
      # we invoke semgrep busts the cache -- in practice that means bumping
      # the pinned semgrep version invalidates it automatically.
      - name: Cache pip wheels
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-semgrep-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            pip-semgrep-${{ runner.os }}-

      - name: Install semgrep
        run: pip install --quiet semgrep

      - name: semgrep --config auto
        run: |
          semgrep --config auto --error \
                  --include='*.c' --include='*.h' \
                  src/ third_party/
